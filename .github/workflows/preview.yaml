name: Deploy PR preview

# Builds each pull request under /pr-preview/pr-<n>/ on the gh-pages branch and
# comments the preview link on the PR. Closing the PR removes the preview.
# Previews only work for branches in this repo; fork PRs get a read-only token.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

# Shared with deploy.yaml so pushes to gh-pages never race.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - if: github.event.action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: github.event.action != 'closed'
        run: npm ci
      - if: github.event.action != 'closed'
        run: npm run check
      - if: github.event.action != 'closed'
        run: npm run build
        env:
          BASE_PATH: /pr-preview/pr-${{ github.event.number }}/
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: museum.etok.me
          qr-code: false
