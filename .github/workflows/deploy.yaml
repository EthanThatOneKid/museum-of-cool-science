name: Deploy to GitHub Pages

# Production builds go to the root of the gh-pages branch, which Pages serves.
# PR previews share that branch under pr-preview/ (see preview.yaml), so this
# deploy leaves that folder alone and rebases instead of force-pushing.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

# Shared with preview.yaml so pushes to gh-pages never race.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
